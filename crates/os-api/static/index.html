<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexOS - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ============ macOS 风应用窗口容器 ============ -->
    <div class="window">

        <!-- ============ 标题栏（Traffic Bar） ============ -->
        <header class="titlebar">
            <!-- 左侧交通灯 -->
            <div class="traffic-lights" aria-label="窗口控制">
                <span class="traffic-light traffic-light--close"   title="关闭"></span>
                <span class="traffic-light traffic-light--minimize" title="最小化"></span>
                <span class="traffic-light traffic-light--zoom"     title="缩放"></span>
            </div>

            <!-- 中间标题 -->
            <div class="titlebar-title">
                <span class="titlebar-app-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4">
                        <rect x="1.5" y="3" width="13" height="9.5" rx="1.5"/>
                        <path d="M5 14.5h6M8 12.5v2"/>
                        <path d="M4 6.5h2M7 6.5h2M10 6.5h2M4 9h2M7 9h2M10 9h2"/>
                    </svg>
                </span>
                <span id="topbar-osname">NexOS</span>
            </div>

            <!-- 右侧：健康指示灯 + 版本号 -->
            <div class="titlebar-right">
                <span class="health-indicator" id="health-indicator" title="健康状态">
                    <span class="health-dot" id="health-dot"></span>
                    <span class="health-text" id="health-text">检测中</span>
                </span>
                <span class="version-badge" id="version-badge">v—</span>
            </div>
        </header>

        <!-- ============ 窗口主体（侧边栏 + 内容区） ============ -->
        <div class="app-layout">

            <!-- ============ 侧边栏（Finder 风格毛玻璃） ============ -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-brand">
                    <span class="brand-logo" aria-hidden="true">
                        <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.3">
                            <rect x="1.5" y="3" width="13" height="9.5" rx="1.5"/>
                            <path d="M5 14.5h6M8 12.5v2"/>
                            <path d="M4 6.5h2M7 6.5h2M10 6.5h2M4 9h2M7 9h2M10 9h2"/>
                        </svg>
                    </span>
                    <span class="brand-name">NexOS</span>
                </div>

                <nav class="nav-list">
                    <a href="#dashboard" class="nav-item active" data-route="dashboard">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <rect x="1.75" y="1.75" width="5" height="5" rx="1"/>
                                <rect x="9.25" y="1.75" width="5" height="5" rx="1"/>
                                <rect x="1.75" y="9.25" width="5" height="5" rx="1"/>
                                <rect x="9.25" y="9.25" width="5" height="5" rx="1"/>
                            </svg>
                        </span>
                        <span class="nav-label">仪表盘</span>
                    </a>
                    <a href="#storage" class="nav-item" data-route="storage">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <ellipse cx="8" cy="3.5" rx="6" ry="2"/>
                                <path d="M2 3.5v9c0 1.1 2.7 2 6 2s6-.9 6-2v-9"/>
                                <path d="M2 8c0 1.1 2.7 2 6 2s6-.9 6-2"/>
                            </svg>
                        </span>
                        <span class="nav-label">存储</span>
                    </a>
                    <a href="#vms" class="nav-item" data-route="vms">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2"/>
                                <path d="M5 14h6M8 11v3"/>
                                <path d="M4 6l2 1.5L4 9M8 9h4"/>
                            </svg>
                        </span>
                        <span class="nav-label">虚拟机</span>
                    </a>
                    <a href="#shares" class="nav-item" data-route="shares">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <circle cx="3.5" cy="8" r="2"/>
                                <circle cx="12.5" cy="4" r="2"/>
                                <circle cx="12.5" cy="12" r="2"/>
                                <path d="M5.3 7l5.4-2.5M5.3 9l5.4 2.5"/>
                            </svg>
                        </span>
                        <span class="nav-label">共享</span>
                    </a>
                    <a href="#users" class="nav-item" data-route="users">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <circle cx="8" cy="5.5" r="2.8"/>
                                <path d="M2.5 14c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"/>
                            </svg>
                        </span>
                        <span class="nav-label">用户</span>
                    </a>
                    <a href="#nodes" class="nav-item" data-route="nodes">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <polygon points="8,1.5 13.5,4.75 13.5,11.25 8,14.5 2.5,11.25 2.5,4.75"/>
                                <circle cx="8" cy="8" r="1.6"/>
                            </svg>
                        </span>
                        <span class="nav-label">节点</span>
                    </a>
                    <a href="#settings" class="nav-item" data-route="settings">
                        <span class="nav-icon" aria-hidden="true">
                            <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3">
                                <circle cx="8" cy="8" r="2.2"/>
                                <path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M3.1 12.9l1.4-1.4M11.5 4.5l1.4-1.4"/>
                            </svg>
                        </span>
                        <span class="nav-label">设置</span>
                    </a>
                </nav>

                <div class="sidebar-footer">
                    <span class="nav-version" id="nav-version">v—</span>
                </div>
            </aside>

            <!-- ============ 内容区 ============ -->
            <div class="main-wrap">
                <!-- 内容工具条（移动端菜单按钮，桌面端占位） -->
                <div class="content-toolbar">
                    <button class="menu-toggle" id="menu-toggle" aria-label="切换导航">
                        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4">
                            <path d="M2 4h12M2 8h12M2 12h12"/>
                        </svg>
                    </button>
                </div>

                <!-- 主内容区（JS 动态填充） -->
                <main class="content" id="content">
                    <div class="loading">加载中…</div>
                </main>
            </div>
        </div>
    </div>

    <!-- 脚本（顺序：API 封装 → 路由/仪表盘 → 各页面模块） -->
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/vms.js"></script>
    <script src="js/shares.js"></script>
    <script src="js/users.js"></script>
    <script src="js/nodes.js"></script>
</body>
</html>
