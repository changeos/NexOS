[package]
name = "os-update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "OS 系统更新：A/B 双槽位 OTA + 回滚 + CVE 监听 + HA 滚动升级（见规划文档 §3.12）（接口契约）"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
async-trait.workspace = true
os-core.workspace = true
os-common.workspace = true
# —— 真实 I/O 依赖（ADR-DEPS-001）——
# HTTP 客户端：更新源清单拉取 + 更新包下载 + NVD/OSV CVE 轮询
reqwest.workspace = true
# 签名校验（ed25519）+ 摘要比对（sha256）——安全关键，不可绕过
ed25519-dalek.workspace = true
sha2.workspace = true
# 签名/摘要的 Base64 编码（manifest.signature 为 Base64）
base64.workspace = true
# sha256 摘要的 hex 编码（discover beacon 同款，已注册 workspace）
hex.workspace = true

[features]
# 提供 MockUpdateEngine / MockRollbackManager / MockCveMonitor / MockRollingUpgrade，
# 供下游 api-agent 测试注入（见 _conventions.md §5）。
# 用法：[dev-dependencies] os-update = { workspace = true, features = ["mock"] }
default = []
mock = []

[dev-dependencies]
tokio.workspace = true
# 测试辅助：生成 ed25519 测试密钥对 + 签名构造（rand_core feature 随 ed25519-dalek）
ed25519-dalek.workspace = true
sha2.workspace = true
base64.workspace = true
# 测试辅助：临时目录（下载往返落盘校验）
tempfile = "3"
