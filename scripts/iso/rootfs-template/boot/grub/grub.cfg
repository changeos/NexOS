# GRUB 引导菜单 —— OS System ISO
# 由 xorriso 打包到 ISO 的 boot/grub/grub.cfg；build-iso.sh 复制本文件。
# casper 负责从 squashfs 加载 live rootfs；`install` 参数触发 installer 流程。

set default=0
set timeout=10

# 默认进入 Live 模式（default=0）；10 秒无操作自动启动。

menuentry "OS System (Live)" {
    linux /casper/vmlinuz boot=casper ---
    initrd /casper/initrd
}

menuentry "OS System (Install)" {
    linux /casper/vmlinuz boot=casper install ---
    initrd /casper/initrd
}

menuentry "OS System (Live, safe graphics)" {
    linux /casper/vmlinuz boot=casper nomodeset ---
    initrd /casper/initrd
}
