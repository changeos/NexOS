{
  "listen": "0.0.0.0:8080",
  "routes": {
    "system": {
      "prefix": "/api/v1/system",
      "enabled": true
    },
    "storage": {
      "prefix": "/api/v1/storage",
      "enabled": true
    },
    "network": {
      "prefix": "/api/v1/network",
      "enabled": true
    },
    "snapshot": {
      "prefix": "/api/v1/snapshots",
      "enabled": true
    },
    "backup": {
      "prefix": "/api/v1/backups",
      "enabled": true
    },
    "compute": {
      "prefix": "/api/v1/compute",
      "enabled": true
    }
  },
  "middleware": {
    "cors": {
      "enabled": true,
      "allow_origins": ["*"],
      "allow_methods": ["GET", "POST", "PUT", "DELETE", "PATCH"],
      "allow_headers": ["Authorization", "Content-Type"]
    },
    "auth": {
      "enabled": false,
      "scheme": "bearer"
    },
    "logging": {
      "enabled": true,
      "level": "info"
    },
    "quota": {
      "enabled": true,
      "rate_limit_per_minute": 600
    }
  }
}
